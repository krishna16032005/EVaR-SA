# Experiment queue. Edit, commit, push -- the runner on the GPU server pulls this
# within one poll interval and starts anything it has not run before.
#
# A job's identity is a hash of its own definition, so:
#   * changing hyperparameters  -> a new job, runs automatically
#   * leaving a job untouched   -> never re-runs, even after a restart
#   * wanting a deliberate redo -> bump `rerun` on that job
#
# Check what happened:  python automation/runner.py --status
# Approve:              python automation/runner.py --approve <name|all>
# Stop everything:      set paused = true below, commit, push

[settings]
paused = false
require_approval = true   # collaborators can queue proposals; only this server can approve them
max_parallel = 8          # 10 cores pinned to this box; each run now uses 1 torch thread
# branch = "live"         # only fast-forward to this branch; merging into it = your release gesture

[defaults]
wandb_project = "evar-deeprl"
device = "cpu"            # env/Python-bound: 8 parallel single-threaded runs beat 1 GPU run

# ---------------------------------------------------------------------------
# Each [[job]] expands to one run per seed. `args` become CLI flags:
# underscores turn into dashes, so n_steps -> --n-steps.
# ---------------------------------------------------------------------------

# ===========================================================================
# PHASE 1 -- alpha sweep. The headline claim is that alpha controls risk
# appetite, so the tail statistics must move monotonically with it. alpha = 1.0
# is the control: EVaR collapses to the mean there, so that run must match a
# risk-neutral baseline. If it does not, the operator is wrong and nothing
# downstream is worth running.
#
# 2000 episodes, not 500: at 500 the c51 runs had already peaked and decayed
# while iqn was still climbing, so the budget -- not the method -- decided the
# comparison.
# ===========================================================================

[[job]]
name = "cartpole-c51-a001"
script = "experiments/run_cartpole.py"
seeds = [0, 1, 2, 3, 4]
group = "cartpole-c51-alpha0.01"
tags = ["c51", "alpha-sweep"]
[job.args]
critic = "c51"
alpha = 0.01
episodes = 2000
eval_risk_episodes = 500

[[job]]
name = "cartpole-c51-a005"
script = "experiments/run_cartpole.py"
seeds = [0, 1, 2, 3, 4]
group = "cartpole-c51-alpha0.05"
tags = ["c51", "alpha-sweep"]
[job.args]
critic = "c51"
alpha = 0.05
episodes = 2000
eval_risk_episodes = 500

[[job]]
name = "cartpole-c51-a01"
script = "experiments/run_cartpole.py"
seeds = [0, 1, 2, 3, 4]
group = "cartpole-c51-alpha0.1-long"
tags = ["c51", "alpha-sweep"]
[job.args]
critic = "c51"
alpha = 0.1
episodes = 2000
eval_risk_episodes = 500

[[job]]
name = "cartpole-c51-a03"
script = "experiments/run_cartpole.py"
seeds = [0, 1, 2, 3, 4]
group = "cartpole-c51-alpha0.3"
tags = ["c51", "alpha-sweep"]
[job.args]
critic = "c51"
alpha = 0.3
episodes = 2000
eval_risk_episodes = 500

[[job]]
name = "cartpole-c51-a10-control"
script = "experiments/run_cartpole.py"
seeds = [0, 1, 2, 3, 4]
group = "cartpole-c51-alpha1.0"
tags = ["c51", "alpha-sweep", "risk-neutral-control"]
[job.args]
critic = "c51"
alpha = 1.0
episodes = 2000
eval_risk_episodes = 500

# ===========================================================================
# PHASE 2 -- critic class at the reference alpha, on the longer budget.
# ===========================================================================

[[job]]
name = "cartpole-iqn-a01"
script = "experiments/run_cartpole.py"
seeds = [0, 1, 2, 3, 4]
group = "cartpole-iqn-alpha0.1-long"
tags = ["iqn", "critic-ablation"]
[job.args]
critic = "iqn"
alpha = 0.1
episodes = 2000
eval_risk_episodes = 500

# ===========================================================================
# PHASE 3 -- the paper's own environment, so the deep numbers can sit beside
# the SPSA ones. Enable once phase 1-2 look sane.
# ===========================================================================

[[job]]
name = "invpend-c51-a01"
script = "experiments/run_invpend.py"
seeds = [0, 1, 2]
group = "invpend-c51-alpha0.1"
tags = ["c51", "mujoco", "paper-env"]
enabled = false
[job.args]
critic = "c51"
alpha = 0.1
episodes = 1500
eval_risk_episodes = 500

[[job]]
name = "invpend-iqn-a01"
script = "experiments/run_invpend.py"
seeds = [0, 1, 2]
group = "invpend-iqn-alpha0.1"
tags = ["iqn", "mujoco", "paper-env"]
enabled = false
[job.args]
