# Experiment queue. Edit, commit, push -- the runner on the GPU server pulls this
# within one poll interval and starts anything it has not run before.
#
# A job's identity is a hash of its own definition, so:
#   * changing hyperparameters  -> a new job, runs automatically
#   * leaving a job untouched   -> never re-runs, even after a restart
#   * wanting a deliberate redo -> bump `rerun` on that job
#
# Check what happened:  python automation/runner.py --status
# Approve:              python automation/runner.py --approve <name|all>
# Stop everything:      set paused = true below, commit, push

[settings]
paused = false
require_approval = true   # collaborators can queue proposals; only this server can approve them
max_parallel = 8          # 10 cores pinned to this box; each run now uses 1 torch thread
# branch = "live"         # only fast-forward to this branch; merging into it = your release gesture

[defaults]
wandb_project = "evar-deeprl"
device = "cpu"            # env/Python-bound: 8 parallel single-threaded runs beat 1 GPU run

# ---------------------------------------------------------------------------
# Each [[job]] expands to one run per seed. `args` become CLI flags:
# underscores turn into dashes, so n_steps -> --n-steps.
# ---------------------------------------------------------------------------

# ===========================================================================
# PHASE 1 -- alpha sweep. The headline claim is that alpha controls risk
# appetite, so the tail statistics must move monotonically with it. alpha = 1.0
# is the control: EVaR collapses to the mean there, so that run must match a
# risk-neutral baseline. If it does not, the operator is wrong and nothing
# downstream is worth running.
#
# 2000 episodes, not 500: at 500 the c51 runs had already peaked and decayed
# while iqn was still climbing, so the budget -- not the method -- decided the
# comparison.
# ===========================================================================

[[job]]
name = "cartpole-c51-a001"
script = "experiments/run_cartpole.py"
seeds = [0, 1, 2, 3, 4]
group = "cartpole-c51-alpha0.01"
tags = ["c51", "alpha-sweep"]
[job.args]
critic = "c51"
alpha = 0.01
episodes = 2000
eval_risk_episodes = 500

[[job]]
name = "cartpole-c51-a005"
script = "experiments/run_cartpole.py"
seeds = [0, 1, 2, 3, 4]
group = "cartpole-c51-alpha0.05"
tags = ["c51", "alpha-sweep"]
[job.args]
critic = "c51"
alpha = 0.05
episodes = 2000
eval_risk_episodes = 500

[[job]]
name = "cartpole-c51-a01"
script = "experiments/run_cartpole.py"
seeds = [0, 1, 2, 3, 4]
group = "cartpole-c51-alpha0.1-long"
tags = ["c51", "alpha-sweep"]
[job.args]
critic = "c51"
alpha = 0.1
episodes = 2000
eval_risk_episodes = 500

[[job]]
name = "cartpole-c51-a03"
script = "experiments/run_cartpole.py"
seeds = [0, 1, 2, 3, 4]
group = "cartpole-c51-alpha0.3"
tags = ["c51", "alpha-sweep"]
[job.args]
critic = "c51"
alpha = 0.3
episodes = 2000
eval_risk_episodes = 500

[[job]]
name = "cartpole-c51-a10-control"
script = "experiments/run_cartpole.py"
seeds = [0, 1, 2, 3, 4]
group = "cartpole-c51-alpha1.0"
tags = ["c51", "alpha-sweep", "risk-neutral-control"]
[job.args]
critic = "c51"
alpha = 1.0
episodes = 2000
eval_risk_episodes = 500

# ===========================================================================
# PHASE 2 -- critic class at the reference alpha, on the longer budget.
# ===========================================================================

[[job]]
name = "cartpole-iqn-a01"
script = "experiments/run_cartpole.py"
seeds = [0, 1, 2, 3, 4]
group = "cartpole-iqn-alpha0.1-long"
tags = ["iqn", "critic-ablation"]
[job.args]
critic = "iqn"
alpha = 0.1
episodes = 2000
eval_risk_episodes = 500

# ===========================================================================
# PHASE 3 -- the paper's own environment, so the deep numbers can sit beside
# the SPSA ones. Enable once phase 1-2 look sane.
# ===========================================================================

[[job]]
name = "invpend-c51-a01"
script = "experiments/run_invpend.py"
seeds = [0, 1, 2]
group = "invpend-c51-alpha0.1"
tags = ["c51", "mujoco", "paper-env"]
enabled = false
[job.args]
critic = "c51"
alpha = 0.1
episodes = 1500
eval_risk_episodes = 500

[[job]]
name = "invpend-iqn-a01"
script = "experiments/run_invpend.py"
seeds = [0, 1, 2]
group = "invpend-iqn-alpha0.1"
tags = ["iqn", "mujoco", "paper-env"]
enabled = false
[job.args]
critic = "iqn"
alpha = 0.1
episodes = 1500
eval_risk_episodes = 500

# ===========================================================================
# PHASE 4 -- Safety-Gymnasium: an environment that actually has risk.
#
# CartPole cannot support C1. It is deterministic bar a +/-0.05 initial state,
# its return is capped at 500 (so the upper tail EVaR is defined on is censored,
# and EVaR saturates onto the cap once p_max >= alpha), and -- decisively -- its
# risk-neutral and risk-seeking optima are the same policy. alpha cannot matter
# there, which is what the first clean sweep showed: tail statistics went
# 105 -> 118 -> 199 -> 125 -> 149 with seed sd of +/-95 to +/-150.
#
# These jobs run in a separate interpreter: safety-gymnasium pins
# gymnasium==0.28.1 / mujoco==2.3.3, which cannot coexist with the main env
# (gymnasium 1.3.0, mujoco 3.11.0). See DOCKER.md for building ~/envs/safety.
#
# STEP 1, and the reason both blocks are disabled: calibrate lambda before
# sweeping alpha. Measured on a random policy over 1000 steps, raw reward return
# is ~0.19 (max 3.55) against raw cost ~104 (max 669) -- so at lambda = 1 the
# priced return is essentially negative cost, the task collapses to pure
# avoidance, and there is no risk/reward tension for alpha to trade off. The
# lambda that puts the two terms in the same range for a *trained* agent has to
# be found empirically. Enable this block first, read
# episode/episode_cost against episode return, then set the alpha sweep's lambda.
# ===========================================================================

[[job]]
name = "safety-pointgoal1-lambda-calib"
script = "experiments/run_safety.py"
python = "~/envs/safety/bin/python"
seeds = [0, 1]
group = "safety-pointgoal1-lambda-calib"
tags = ["c51", "safety-gymnasium", "lambda-calibration"]
enabled = false
[job.args]
env = "SafetyPointGoal1-v0"
critic = "c51"
alpha = 0.1
cost_penalty = 0.25
episodes = 1000
n_atoms = 101
eval_risk_episodes = 500

# STEP 2 -- the alpha sweep, once lambda is known to produce real tail spread.
# Set cost_penalty here to whatever step 1 selects. alpha = 1.0 is the control.
# Note alpha > 1/n_atoms and alpha > 1/eval_risk_episodes both bind: at 101 atoms
# and 500 eval episodes the floors are 0.0099 and 0.002, so alpha = 0.01 is only
# just admissible -- run_safety.py refuses anything below either floor.

[[job]]
name = "safety-pointgoal1-alpha-sweep"
script = "experiments/run_safety.py"
python = "~/envs/safety/bin/python"
seeds = [0, 1, 2, 3, 4]
group = "safety-pointgoal1-alpha-sweep"
tags = ["c51", "safety-gymnasium", "alpha-sweep"]
enabled = false
[job.args]
env = "SafetyPointGoal1-v0"
critic = "c51"
alpha = 0.1
cost_penalty = 0.25
episodes = 2000
n_atoms = 101
eval_risk_episodes = 500
